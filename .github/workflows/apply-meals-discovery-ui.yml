name: Apply Meals discovery UI

on:
  push:
    paths:
      - 'scripts/update-meals-discovery-ui.mjs'
      - '.github/workflows/apply-meals-discovery-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Meals screen
        run: node scripts/update-meals-discovery-ui.mjs
      - name: Commit app change
        run: |
          if git diff --quiet -- features/whole-shop/WholeShopApp.js; then
            echo 'No app changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add features/whole-shop/WholeShopApp.js
          git commit -m 'Categorise meal discovery and add filters'
          git push origin HEAD:main
